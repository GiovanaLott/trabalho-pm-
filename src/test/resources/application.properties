spring.application.name=sistema-hospitalar-test

# =======================================================
# Base de Dados H2 em Memoria para Testes Automatizados
# Responsavel: Bernardo
# Garante testes rapidos, confiaveis e independentes de rede
# =======================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA para ambiente de testes
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
