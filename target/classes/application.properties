spring.application.name=sistema-hospitalar

# =======================================================
# Conexao Banco de Dados - PostgreSQL (Supabase)
# Responsavel: Bernardo
# Projeto Supabase: shluawyyxdnitwcaagwx
# =======================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://db.shluawyyxdnitwcaagwx.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver

# Configuracoes do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Pool de Conexoes HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
