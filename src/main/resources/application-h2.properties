# =============================================================================
# Perfil "h2": executa a aplicacao SEM precisar do MySQL (banco em memoria,
# zerado a cada execucao). Uso:
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Tambem e o perfil usado pelos testes automatizados.
# =============================================================================
spring.datasource.url=jdbc:h2:mem:hospitaldb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
