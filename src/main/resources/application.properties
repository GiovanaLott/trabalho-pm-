spring.application.name=sistema-hospitalar

# =============================================================================
# Banco de dados principal: MySQL 8
# Os valores abaixo sao os padroes de desenvolvimento, iguais aos criados pelo
# script docs/sql/01_criar_banco.sql. Para usar outros valores NAO edite este
# arquivo: defina variaveis de ambiente (DB_HOST, DB_PORT, DB_NAME, DB_USER,
# DB_PASSWORD). Sem MySQL instalado, rode com o perfil "h2" (ver README/docs).
# =============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hospitaldb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:hospital_app}
spring.datasource.password=${DB_PASSWORD:hospital123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexoes (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# =============================================================================
# JPA / Hibernate
# ddl-auto=update cria/ajusta as tabelas automaticamente (adequado ao projeto
# academico). Em producao o ideal seria "validate" + migrations (Flyway).
# =============================================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
