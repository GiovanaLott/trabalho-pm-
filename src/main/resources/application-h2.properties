# =============================================================================
# Perfil "h2": executa a aplicacao SEM precisar do Supabase/PostgreSQL
# (banco em memoria, zerado a cada execucao). Uso:
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Console do banco: http://localhost:8080/h2-console  (JDBC URL abaixo, usuario "sa")
# =============================================================================
spring.datasource.url=jdbc:h2:mem:hospitaldb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
